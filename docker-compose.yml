services:
  postgres:
    image: postgres:16-alpine
    container_name: ashare-postgres
    environment:
      POSTGRES_USER: ashare
      POSTGRES_PASSWORD: ashare
      POSTGRES_DB: ashare
    ports:
      - "55432:5432"
    volumes:
      - ashare_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ashare -d ashare"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  ashare_pgdata:
